
<!DOCTYPE html>
<html>
    <head>
        <title>Add Password</title>
        <style>
            * {margin: 0; padding: 0;box-sizing: border-box;}
            body{
                background-color: #0a0a0a;
                color: white;
                font-family: 'Georgia';
            }
            .navbar{
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: #111111;
                border-bottom: 1px solid #e9a227;
                padding: 15px 30px;
            }

            .navbar h1{
                color: #c9a227;
                font-size: 22px;
                letter-spacing: 3px;
            }
            .navbar a{
                padding: 8px 18px;
                color: #0a0a0a;
                background: #c9a227;
                border-radius: 6px;
                font-size: 13px;
                margin-left: 10px;
                letter-spacing: 1px;
                text-decoration: none;
            }
            .navbar a:hover{
                background: linear-gradient(135deg, #f0c040, #c9a227);
                box-shadow: 0 0 20px rgba(201, 162, 39, 0.4);
            }
            .form-box{
                max-width: 400px;
                margin: 60px auto;
                background: #111111;
                border:1px solid #c9a227;
                border-radius: 12px;
                padding: 40px;
            }
            h2{
                color:#c9a227;
                letter-spacing: 2px;
                margin-bottom: 30px;
                text-align: center;
            }
            label{
                color:#888;
                font-size: 13px;
                letter-spacing: 2px;
                display: flex;
                margin-bottom: 7px;
            }
            input{
                width: 100%;
                padding: 12px;
                background: #0a0a0a;
                border: 1px solid #333;
                border-radius: 8px;
                color: white;
                font-size: 14px;
                margin-bottom: 20px;
                outline: none;
            }
            input:focus  {
                border-color: #c9a227;
            }
            button {
                width: 100%;
                padding: 15px;
                background: #c9a227;
                color: #0a0a0a;
                border: none;
                border-radius: 4px;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
                letter-spacing: 2px;

            }
            button:hover {
                background: linear-gradient(135deg, #f0c040, #c9a227);
                box-shadow: 0 0 20px rgba(201, 162, 39, 0.4);
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <h1>Valut</h1>
            <a href="/home"><-Back</a>
        </div>
        <div class="form-box">
            <h2>ADD PASSWORD</h2>
            <form action="/add" method="post">
                <label>Site Name</label>
                <input type="text" name="site" placeholder="e.g. google.com">
                <label>Username</label>
                <input type="text" name="username" placeholder="e.g. john@gmail.com">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter Password">
                <button type="submit">Save Password</button>
            </form>
        </div>
    </body>
</html>
