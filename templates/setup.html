<!DOCTYPE html>
<html>
    <head>
        <title>Valut-Setup</title>
        <style>
            * {margin: 0; padding: 0 ; box-sizing: border-box;}
            body {
                background-color: #0a0a0a;
                color: white;
                font-family: 'Georgia',serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }

            .box{
                background: #111111;
                border: 1px solid #c9a227;
                border-radius: 16px;
                padding: 50px 40px;
                width: 380px;
                text-align: center;
            }
            .icon{
                font-size: 48px;
                margin-bottom: 20px;
            }
            h1{
                color: #c9a227;
                font-size: 24px;
                letter-spacing: 1px;
                margin-bottom: 8px;
            }
            p{
                color: #888;
                font-size: 13px;
                letter-spacing: 1px;
                margin-bottom: 30px;
            }
            input{
                width:100%;
                padding: 14px;
                background: #0a0a0a;
                border: 1px solid #333;
                border-radius: 8px;
                color: white;
                outline: none;
                font-size: 14px;
                margin-bottom: 15px;
            }
            
            input:focus{
                border-color: #c9a227;
            }

            button{
                width: 100%;
                padding: 14px;
                background: #c9a227;
                color: #0a0a0a;
                border: none;
                border-radius: 8px;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
                letter-spacing: 2px;
            }
            button:hover{
                background: linear-gradient(135deg, #f0c040, #c9a227);
                box-shadow: 0 0 20px rgba(201, 162, 39, 0.4);
            }
            .footer{
                color: #444;
                font-size: 11px;
                letter-spacing: 1px;
                margin-top: 5px;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <div class="icon">🔑</div>
            <h1>SETUP VALUT</h1>
            <p>Create your master passwordto get started</p>
            <form action="/setup" method="POST">
                <input type="password" name="master" placeholder="Create master password">
                <input type="password" name="confirm" placeholder="confirm master password">
                <button type="submit">Create Valut</button>

            </form>
            <p class="footer">*This password cannot be recovered. Keep it safe.</p>
        </div>
    </body>
</html>
